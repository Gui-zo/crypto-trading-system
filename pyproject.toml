[project]
name = "crypto-trading-system"
version = "0.0.0"
description = "Autonomous crypto trading platform (delta-neutral funding-rate carry on Binance USDS-M perpetuals, initial domain)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "websockets>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Deployed runtimes only. A local checkout never needs these, so `uv sync`
# without the extra keeps working exactly as before.
aws = ["boto3>=1.34"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
# The repo is a single uv-managed project. Domain code lives under packages/*,
# each a top-level importable package (e.g. `import domain.modes`). We rely on
# pytest's `pythonpath` rather than an editable install so new packages can be
# added without touching build config. See docs/adr/0002.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "apps", "tests"]
# Autogenerated migration scripts are not hand-maintained.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "C4",            # comprehensions
    "RUF",           # ruff-specific
]

[tool.mypy]
python_version = "3.12"
mypy_path = "packages"
strict = true
warn_unreachable = true
warn_redundant_casts = true
namespace_packages = true
explicit_package_bases = true
exclude = ["^migrations/versions/"]

[[tool.mypy.overrides]]
# boto3 is an optional deploy-time dependency and ships no stubs by default.
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["packages"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
